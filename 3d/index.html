<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Night Patrol 3D (preview)</title><meta name="theme-color" content="#05040f">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-180.png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05040f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
canvas{display:block}#app{position:fixed;inset:0}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse at 70% 20%,#2b1640,#05040f 70%);z-index:20;text-align:center;padding:10px}
h1{margin:0;font-size:min(9vw,56px);letter-spacing:2px;color:#e9e3ff;text-shadow:0 0 18px #9b5cff}h1 small{font-size:.4em;color:#7dffa8;display:block;letter-spacing:4px}
button{font:inherit;font-weight:800;color:#fff;background:#2a2050;border:2px solid #b9a6ff;border-radius:12px;padding:10px 16px;cursor:pointer}
button.sel{background:#6a4cff}.red{background:#8a1a4a!important}.go{background:#1f9d55;font-size:24px;padding:12px 40px}
.hb{min-width:130px}.hb small{display:block;font-size:11px;color:#b9a6ff}.sw{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid #000}.sw.sel{border-color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}#tip{max-width:560px;color:#d8d0ff;font-size:14px;margin:0}
#hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:5;text-shadow:0 2px 3px #000}
#hud .tl{position:absolute;left:14px;top:10px;font-weight:800}#hp{color:#ff5577;font-size:22px}#fuelW{width:100px;height:7px;background:#0008;margin-top:4px}#fuel{height:7px;background:#ffa630}
#hud .tc{position:absolute;left:50%;top:8px;transform:translateX(-50%);text-align:center;font-weight:800}#score{color:#ffe066;font-size:20px}#obj{color:#d8d0ff}
#arrowW{margin:4px auto;width:40px;height:40px;position:relative}#arrow{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:30px solid #ffe066;margin:4px auto;filter:drop-shadow(0 0 6px #ffe066)}#dist{font-size:12px;color:#ffe066}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);font-weight:800;font-size:22px;opacity:0;transition:opacity .5s;text-align:center;max-width:80%;text-shadow:0 2px 4px #000;z-index:6;pointer-events:none}
#q,#fps{position:absolute;right:70px;top:12px;font-size:11px;color:#b9a6ff}#fps{top:26px}
#touch{display:none;position:fixed;inset:0;z-index:4}#joy{position:absolute;left:50px;bottom:50px;width:120px;height:120px;border-radius:50%;background:#ffffff14;border:3px solid #ffffff40;opacity:.5}
#knob{position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;background:#ffffff70}
.btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:3px solid;background:#0003}
.btn.on{filter:brightness(1.8);transform:scale(.94)}#bJump{right:30px;bottom:40px;width:104px;height:104px;border-color:#39e27a;background:#39e27a30}
#bFire{right:150px;bottom:30px;width:88px;height:88px;border-color:#ff5577;background:#ff557730}#bSp{right:44px;bottom:160px;width:88px;height:88px;border-color:#4fc3ff;background:#4fc3ff30}
#pause{position:absolute;right:14px;top:10px;width:46px;height:42px;border-radius:10px;border:2px solid #b9a6ff;background:#2a2050;display:flex;align-items:center;justify-content:center;font-weight:800}
#scare{display:none;position:fixed;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle,#b6ff4a30,transparent 70%)}
#scare canvas{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%)}
@keyframes scare{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.05)}70%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.6)}}
#rot{display:none;position:fixed;inset:0;background:#05040f;z-index:99;align-items:center;justify-content:center;font-weight:800;font-size:22px;text-align:center}
@media (orientation:portrait) and (max-width:1100px){#rot{display:flex}}
</style></head><body>
<div id="app"></div>
<div id="menu" class="ov">
  <h1>NIGHT PATROL<small>3D PREVIEW · MISSION 1</small></h1>
  <div class="row" id="heroes"></div><div class="row" id="cols"></div>
  <p id="tip"></p><div style="color:#b9a6ff">Hero: <b id="who"></b> <small>(change the name in the classic game)</small></div>
  <div class="row"><button id="scaryB">SCARY</button><button id="saverB">SAVER</button><button id="qB">QUALITY</button></div>
  <button id="go" class="go">▶ START PATROL</button>
  <div class="row" style="font-size:12px;color:#b9a6ff"><span>No ads · No chat · No data collected</span><span id="offB" style="color:#7dffa8"></span><a href="../" style="color:#b9a6ff">Classic 2D game</a></div>
</div>
<div id="hud"><div class="tl"><div id="name"></div><div id="hp"></div><div id="fuelW"><div id="fuel"></div></div></div>
  <div class="tc"><div id="score"></div><div id="obj"></div><div id="arrowW"><div id="arrow"></div></div><div id="dist"></div></div><div id="q"></div><div id="fps"></div></div>
<div id="toast"></div>
<div id="touch"><div id="joy"><div id="knob"></div></div><div class="btn" id="bJump">JUMP</div><div class="btn" id="bFire">BLAST</div><div class="btn" id="bSp">SP</div><div class="btn" id="pause" style="border-radius:10px">II</div></div>
<div id="pauseMenu" class="ov" style="display:none"><h1>Paused</h1><div class="row"><button onclick="document.getElementById('pause').click()" class="go">RESUME</button><button onclick="location.reload()">MENU</button></div></div>
<div id="end" class="ov" style="display:none"><h1 id="endMsg"></h1><div class="row"><button class="go" onclick="location.reload()">PLAY AGAIN</button><a href="../"><button>CLASSIC GAME</button></a></div></div>
<div id="scare"><canvas id="scareC" width="420" height="420"></canvas></div>
<div id="rot">🌙<br>Turn your tablet sideways</div>
<script>
(function(){const c=document.getElementById('scareC').getContext('2d');c.fillStyle='rgba(125,44,255,.25)';c.beginPath();c.arc(210,210,205,0,7);c.fill();c.fillStyle='#07040d';c.beginPath();c.arc(210,215,165,0,7);c.fill();
for(let i=0;i<9;i++){const a=Math.PI+i*Math.PI/8;c.beginPath();c.moveTo(210+Math.cos(a-.2)*150,215+Math.sin(a-.2)*150);c.lineTo(210+Math.cos(a+.2)*150,215+Math.sin(a+.2)*150);c.lineTo(210+Math.cos(a)*210,215+Math.sin(a)*210);c.fill();}
c.fillStyle='#eafff0';[[140,170],[280,170]].forEach(([x,y])=>{c.beginPath();c.ellipse(x,y,40,52,0,0,7);c.fill();});c.fillStyle='#000';[[145,180],[275,180]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,9,0,7);c.fill();});
c.fillStyle='#1a0a2a';c.beginPath();c.ellipse(210,300,125,46,0,0,7);c.fill();c.fillStyle='#e8f5d0';for(let i=0;i<10;i++){const x=100+i*22;c.beginPath();c.moveTo(x,268);c.lineTo(x+20,268);c.lineTo(x+10,296);c.fill();c.beginPath();c.moveTo(x,334);c.lineTo(x+20,334);c.lineTo(x+10,306);c.fill();}})();
</script>
<script src="audio.js"></script>
<script src="game3d.js"></script>
</body></html>
